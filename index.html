<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tineco Product Compare</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f3;color:#1a1a1a;padding:1.5rem}
h1{font-size:22px;font-weight:500;margin-bottom:4px}
.sub{font-size:13px;color:#666;margin-bottom:1.5rem}
.selectors{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:1.25rem}
.sel-box{background:#ebebeb;border-radius:12px;padding:14px 16px}
.sel-label{font-size:11px;color:#999;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.sel-box select{width:100%;font-size:13px;font-weight:500;background:#fff;border:1px solid #ddd;border-radius:6px;color:#1a1a1a;outline:none;cursor:pointer;padding:5px 7px;margin-bottom:6px}
.compare-wrap{border:1px solid #e0e0e0;border-radius:12px;overflow:hidden;background:#fff}
.compare-table{width:100%;border-collapse:collapse;table-layout:fixed}
.compare-table th,.compare-table td{padding:10px 12px;font-size:13px;vertical-align:middle;border-bottom:1px solid #f0f0f0}
.compare-table tr:last-child td,.compare-table tr:last-child th{border-bottom:none}
.col-feature{width:34%;color:#666;font-size:12px;background:#fafafa;font-weight:400}
.col-a,.col-b{width:33%;text-align:center}
.head-row th{background:#fafafa;padding:16px 12px;border-bottom:1px solid #e0e0e0}
.model-head{font-size:13px;font-weight:500;color:#1a1a1a;line-height:1.4}
.series-head{font-size:11px;color:#999;margin-top:2px}
.badge-a{display:inline-block;font-size:10px;padding:2px 8px;border-radius:20px;background:#e8f0fe;color:#1a56db;margin-bottom:6px}
.badge-b{display:inline-block;font-size:10px;padding:2px 8px;border-radius:20px;background:#fef3c7;color:#92400e;margin-bottom:6px}
.section-row th{background:#f5f5f3;font-size:11px;font-weight:500;color:#888;text-transform:uppercase;letter-spacing:.05em;padding:6px 12px}
.section-row td{background:#f5f5f3;padding:6px 12px}
.val-yes{color:#15803d;font-size:16px;font-weight:500}
.val-no{color:#dc2626;font-size:16px}
.val-text{color:#1a1a1a;font-size:12px;line-height:1.4}
.modes-cell{display:flex;flex-wrap:wrap;gap:3px;justify-content:center}
.mode-tag{font-size:10px;padding:2px 7px;border-radius:20px;background:#e8f0fe;color:#1a56db}
.empty-state{text-align:center;padding:3rem;color:#aaa;font-size:13px}
.hl{background:#f0fdf4}
.warranty-th{color:#15803d;font-size:12px}
@media(max-width:600px){
  body{padding:1rem}
  .selectors{grid-template-columns:1fr}
}
</style>
</head>
<body>

<h1>Tineco Product Compare</h1>
<p class="sub">Select any two models across any series</p>

<div class="selectors">
  <div class="sel-box">
    <div class="sel-label">Model A</div>
    <select id="serA" onchange="syncSel('A',this.value)"></select>
    <select id="selA" onchange="render()"><option value="">— select model —</option></select>
  </div>
  <div class="sel-box">
    <div class="sel-label">Model B</div>
    <select id="serB" onchange="syncSel('B',this.value)"></select>
    <select id="selB" onchange="render()"><option value="">— select model —</option></select>
  </div>
</div>

<div id="output"></div>

    "S7 Fold Pro":{suction:"22kPa",runtime:"70",clean_tank:"—",dirty_tank:"—",steam:"❌",lay_flat:"3.78\" lay-flat",electrolyzed:"✅",edge:"Triple-sided",antitangle:"DualBlock",self_clean:"FlashDry / SilentDry",silentdry:"✅",reverse_scrub:"❌",self_prop:"90° Foldable Handle",modes:["Auto","Max","Suction","Quiet"],extras:{"Weight":"3.9kg","Scraper":"Smart-Sensing StreakFree Scraper","Voice":"Voice Assistant"}},

    "S9 Artist Breeze II":{suction:"22kPa",runtime:"65",clean_tank:"1.0L",dirty_tank:"0.75L",steam:"❌",lay_flat:"180°",electrolyzed:"❌",edge:"Triple-sided",antitangle:"DualBlock",self_clean:"FlashDry / SilentDry",silentdry:"✅",reverse_scrub:"❌",self_prop:"90° Swivel + Front Assistance",modes:["Auto","Max","Suction","Quiet"],extras:{"Stretch":"HyperStretch Technology","Display":"3D Light Display + Thumb Screen","Accessories":"2x HEPA Filter, 2x Roller Brush, 1x 500ml Cleaning Solution"}},
    "S9 Artist Premium II":{suction:"22kPa",runtime:"65",clean_tank:"—",dirty_tank:"—",steam:"❌",lay_flat:"—",electrolyzed:"✅",edge:"Triple-sided",antitangle:"DualBlock",self_clean:"FlashDry / SilentDry + Bi-directional Brush",silentdry:"✅",reverse_scrub:"✅",self_prop:"90° Swivel + SmoothDrive",modes:["Auto","Max","Suction"],extras:{"Backtrack":"Backtrack Water Erasure","Voice":"Voice Assistant"}}
  }},
  "iFloor i Series":{prefix:"iFloor",models:{
    "i7 Stretch Steam":{suction:"25kPa",runtime:"80",clean_tank:"—",dirty_tank:"—",steam:"160°C HyperSteam",lay_flat:"—",electrolyzed:"❌",edge:"Triple-sided",antitangle:"DualBlock",self_clean:"FlashDry",silentdry:"❌",reverse_scrub:"❌",self_prop:"45° Swivel",modes:["Auto","Max","Steam"],extras:{"Brush":"Heat-Resistant Brush Roller","Display":"Smart LED Display"}},
    "i7 Fold":{suction:"22kPa",runtime:"50",clean_tank:"—",dirty_tank:"—",steam:"❌",lay_flat:"3.78\" lay-flat",electrolyzed:"❌",edge:"Dual-sided",antitangle:"DualBlock",self_clean:"FlashDry / SilentDry + Bi-directional Brush",silentdry:"✅",reverse_scrub:"❌",self_prop:"180° Foldable Tube",modes:["Auto","Max","Suction","Quiet"],extras:{"Weight":"3.5kg","Voice":"Voice Assistant"}},
    "i6 Stretch II":{suction:"20kPa",runtime:"60",clean_tank:"—",dirty_tank:"—",steam:"❌",lay_flat:"180°",electrolyzed:"❌",edge:"Dual-sided",antitangle:"Anti-Tangle",self_clean:"One-Touch + Heated Water + 85°C FlashDry in 5 mins",silentdry:"❌",reverse_scrub:"❌",self_prop:"45° Swivel",modes:["Auto","Max","Quiet"],extras:{}},

  }},
  "Cordless Vacuum":{prefix:"",models:{
    "S30 Pro":{suction:"200W",runtime:"—",clean_tank:"—",dirty_tank:"—",steam:"❌",lay_flat:"180° Foldable Tube",electrolyzed:"❌",edge:"—",antitangle:"ZeroTangle",self_clean:"❌",silentdry:"❌",reverse_scrub:"❌",self_prop:"Wall Mounted",modes:[],extras:{"Filtration":"6-Stage","Attachments":"Multiple"}},

    "A30S":{suction:"160W",runtime:"60",clean_tank:"—",dirty_tank:"—",steam:"❌",lay_flat:"—",electrolyzed:"❌",edge:"—",antitangle:"ZeroTangle",self_clean:"❌",silentdry:"❌",reverse_scrub:"❌",self_prop:"—",modes:[],extras:{"Sensor":"iLoop Smart Sensor"}},
    "Go Mini Pet":{suction:"18AW",runtime:"20",clean_tank:"—",dirty_tank:"—",steam:"❌",lay_flat:"—",electrolyzed:"❌",edge:"—",antitangle:"❌",self_clean:"❌",silentdry:"❌",reverse_scrub:"❌",self_prop:"—",modes:[],extras:{"Design":"Ultra Lightweight"}}
  }},
  "Carpet Series":{prefix:"",models:{
    "iCarpet Spot":{suction:"45AW",runtime:"—",clean_tank:"—",dirty_tank:"—",steam:"❌",lay_flat:"—",electrolyzed:"❌",edge:"—",antitangle:"❌",self_clean:"❌",silentdry:"❌",reverse_scrub:"❌",self_prop:"—",modes:[],extras:{"Hose":"1.5m Hose","Weight":"3.7kg Compact","Tank":"2-in-1 Water Tank"}},
    "Carpet One Cruiser":{suction:"130W",runtime:"—",clean_tank:"—",dirty_tank:"—",steam:"❌",lay_flat:"—",electrolyzed:"❌",edge:"—",antitangle:"❌",self_clean:"FlashDry",silentdry:"❌",reverse_scrub:"❌",self_prop:"3-level SmoothPower",modes:["Auto","Max","Drying"],extras:{"Dry tech":"75°C DualCore PowerDry","System":"DrySense System"}}

const SERIES=Object.keys(DATA);

function buildSeriesSel(id,def){
  const s=document.getElementById(id);
  s.innerHTML='';
  SERIES.forEach(sr=>{const o=document.createElement('option');o.value=sr;o.textContent=sr;if(sr===def)o.selected=true;s.appendChild(o);});
}

function syncSel(ab,explicitSeries){
  const series=explicitSeries||document.getElementById('ser'+ab).value;
  if(!series||!DATA[series])return;
  const models=Object.keys(DATA[series].models);
  const sel=document.getElementById('sel'+ab);
  sel.innerHTML='<option value="">— select model —</option>';
  models.forEach(m=>{const o=document.createElement('option');o.value=m;o.textContent=m;sel.appendChild(o);});
  sel.value=models[0]||'';
  render();
}

function val(v){
  if(v==='✅')return'<span class="val-yes">✓</span>';
  if(v==='❌')return'<span class="val-no">✗</span>';
  if(!v||v==='—')return'<span style="color:#bbb;font-size:12px">—</span>';
  return'<span class="val-text">'+v+'</span>';
}

function numOf(s){
  if(!s||s==='—'||s==='❌'||s==='✅')return null;
  const m=s.match(/(\d+(\.\d+)?)/);return m?parseFloat(m[1]):null;
}

function hlRow(va,vb,hi){
  const na=numOf(va),nb=numOf(vb);
  if(na===null||nb===null||na===nb)return['',''];
  return hi?[na>nb?'hl':'',nb>na?'hl':'']:[na<nb?'hl':'',nb<na?'hl':''];
}

function row(label,dA,dB,key,hi=true){
  const va=dA?dA[key]:'—',vb=dB?dB[key]:'—';
  const[ha,hb]=hlRow(va,vb,hi);
  return'<tr><th class="col-feature">'+label+'</th><td class="col-a '+ha+'">'+(dA?val(va):'<span style="color:#bbb">—</span>')+'</td><td class="col-b '+hb+'">'+(dB?val(vb):'<span style="color:#bbb">—</span>')+'</td></tr>';
}

function brow(label,dA,dB,key){
  const va=dA?dA[key]:'—',vb=dB?dB[key]:'—';
  return'<tr><th class="col-feature">'+label+'</th><td class="col-a">'+(dA?val(va):'—')+'</td><td class="col-b">'+(dB?val(vb):'—')+'</td></tr>';
}

function modesRow(dA,dB){
  const ma=dA?dA.modes:[],mb=dB?dB.modes:[];
  const cA=ma.length?'<div class="modes-cell">'+ma.map(m=>'<span class="mode-tag">'+m+'</span>').join('')+'</div>':'<span style="color:#bbb;font-size:12px">—</span>';
  const cB=mb.length?'<div class="modes-cell">'+mb.map(m=>'<span class="mode-tag">'+m+'</span>').join('')+'</div>':'<span style="color:#bbb;font-size:12px">—</span>';
  return'<tr><th class="col-feature">Cleaning modes</th><td class="col-a">'+(dA?cA:'—')+'</td><td class="col-b">'+(dB?cB:'—')+'</td></tr>';
}

function sec(label){return'<tr class="section-row"><th class="col-feature">'+label+'</th><td></td><td></td></tr>';}

function render(){
  const serA=document.getElementById('serA').value,serB=document.getElementById('serB').value;
  const mA=document.getElementById('selA').value,mB=document.getElementById('selB').value;
  const out=document.getElementById('output');
  if(!mA&&!mB){out.innerHTML='<div class="empty-state">Select at least one model to compare</div>';return;}
  const dA=mA?DATA[serA].models[mA]:null,dB=mB?DATA[serB].models[mB]:null;
  const pfxA=DATA[serA].prefix,pfxB=DATA[serB].prefix;
  const headA=mA?'<div class="badge-a">Model A</div><div class="model-head">'+(pfxA?pfxA+' ':'')+mA+'</div><div class="series-head">'+serA+'</div>':'<span style="color:#bbb;font-size:13px">—</span>';
  const headB=mB?'<div class="badge-b">Model B</div><div class="model-head">'+(pfxB?pfxB+' ':'')+mB+'</div><div class="series-head">'+serB+'</div>':'<span style="color:#bbb;font-size:13px">—</span>';
  const floorSeries=["Floor One S6","Floor One S7","Floor One S9","iFloor i Series","Y Series"];
  const showFloor=floorSeries.includes(serA)||floorSeries.includes(serB);
  const hasTanks=(dA?.clean_tank&&dA.clean_tank!=='—')||(dB?.clean_tank&&dB.clean_tank!=='—');
  const allExtras=[...new Set([...Object.keys(dA?.extras||{}),...Object.keys(dB?.extras||{})])];
  const extrasRows=allExtras.map(k=>{
    const va=dA?.extras?.[k]||'❌',vb=dB?.extras?.[k]||'❌';
    return'<tr><th class="col-feature">'+k+'</th><td class="col-a">'+val(va)+'</td><td class="col-b">'+val(vb)+'</td></tr>';
  }).join('');

  let body=sec("Performance")+row("Suction power",dA,dB,"suction",true)+modesRow(dA,dB)+row("Runtime (mins)",dA,dB,"runtime",true);

  if(showFloor){
    body+=sec("Steam")+brow("Steam cleaning",dA,dB,"steam");
    body+=sec("Cleaning features")+brow("Lay-flat design",dA,dB,"lay_flat")+brow("Electrolyzed water",dA,dB,"electrolyzed")+brow("Edge cleaning",dA,dB,"edge")+brow("Anti-tangle",dA,dB,"antitangle")+brow("ReverseScrub technology",dA,dB,"reverse_scrub");
    body+=sec("Self-cleaning")+brow("Self-clean system",dA,dB,"self_clean")+brow("SilentDry mode",dA,dB,"silentdry");
    body+=sec("Maneuverability")+brow("Swivel / propulsion",dA,dB,"self_prop");
    if(hasTanks) body+=sec("Water tanks")+row("Clean water tank",dA,dB,"clean_tank",true)+row("Dirty water tank",dA,dB,"dirty_tank",true);
  }

  if(extrasRows) body+=sec("Additional features")+extrasRows;
  body+='<tr><th class="col-feature warranty-th">Warranty</th><td class="col-a"><span class="val-text">2-Year Local</span></td><td class="col-b"><span class="val-text">2-Year Local</span></td></tr>';

  out.innerHTML='<div class="compare-wrap"><table class="compare-table"><thead><tr class="head-row"><th class="col-feature"></th><th class="col-a">'+headA+'</th><th class="col-b">'+headB+'</th></tr></thead><tbody>'+body+'</tbody></table></div>';
}

buildSeriesSel('serA','Floor One S7');
buildSeriesSel('serB','Floor One S9');
syncSel('A','Floor One S7');
syncSel('B','Floor One S9');
</script>
</body>
</html>
