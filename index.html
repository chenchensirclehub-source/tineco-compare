<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tineco Product Compare</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f3;color:#1a1a1a;padding:1.5rem}
h1{font-size:22px;font-weight:500;margin-bottom:4px}
.sub{font-size:13px;color:#666;margin-bottom:1.25rem}
.slots-wrap{display:flex;gap:10px;margin-bottom:1.25rem;flex-wrap:wrap;align-items:flex-start}
.slot{background:#ebebeb;border-radius:12px;padding:14px 16px;min-width:160px;flex:1}
.slot-label{font-size:11px;color:#999;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.slot-label button{font-size:10px;background:none;border:none;color:#bbb;cursor:pointer;padding:0;line-height:1}
.slot-label button:hover{color:#888}
.slot select{width:100%;font-size:13px;font-weight:500;background:#fff;border:1px solid #ddd;border-radius:6px;color:#1a1a1a;outline:none;cursor:pointer;padding:5px 7px;margin-bottom:6px}
.add-btn{background:#fff;border:1.5px dashed #ccc;border-radius:12px;padding:14px 16px;font-size:13px;color:#999;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;min-width:120px;white-space:nowrap;transition:border-color .15s,color .15s}
.add-btn:hover{border-color:#888;color:#555}
.output-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.compare-wrap{border:1px solid #e0e0e0;border-radius:12px;overflow:hidden;background:#fff;min-width:500px}
.compare-table{width:100%;border-collapse:collapse;table-layout:fixed}
.compare-table th,.compare-table td{padding:10px 12px;font-size:13px;vertical-align:middle;border-bottom:1px solid #f0f0f0}
.compare-table tr:last-child td,.compare-table tr:last-child th{border-bottom:none}
.col-feature{width:140px;min-width:140px;color:#666;font-size:12px;background:#fafafa;font-weight:400}
.col-model{min-width:150px;text-align:center}
.head-row th{background:#fafafa;padding:16px 12px;border-bottom:1px solid #e0e0e0}
.model-head{font-size:13px;font-weight:500;color:#1a1a1a;line-height:1.4}
.brand-head{font-size:11px;color:#999;margin-top:2px}
.badge{display:inline-block;font-size:10px;padding:2px 8px;border-radius:20px;margin-bottom:6px}
.badge-0{background:#e8f0fe;color:#1a56db}
.badge-1{background:#fef3c7;color:#92400e}
.badge-2{background:#fce7f3;color:#9d174d}
.badge-3{background:#d1fae5;color:#065f46}
.section-row th{background:#f5f5f3;font-size:11px;font-weight:500;color:#888;text-transform:uppercase;letter-spacing:.05em;padding:6px 12px}
.section-row td{background:#f5f5f3;padding:6px 12px}
.val-yes{color:#15803d;font-size:16px;font-weight:500}
.val-no{color:#dc2626;font-size:16px}
.val-text{color:#1a1a1a;font-size:12px;line-height:1.4}
.modes-cell{display:flex;flex-wrap:wrap;gap:3px;justify-content:center}
.mode-tag{font-size:10px;padding:2px 7px;border-radius:20px;background:#e8f0fe;color:#1a56db}
.empty-state{text-align:center;padding:3rem;color:#aaa;font-size:13px}
.hl{background:#f0fdf4}
.warranty-th{color:#15803d;font-size:12px}
.brand-tineco .model-head{color:#1a1a1a}
.brand-dreame .model-head{color:#1a1a1a}
.brand-roborock .model-head{color:#1a1a1a}
@media(max-width:600px){body{padding:1rem}.slots-wrap{flex-direction:column}}
</style>
</head>

const SERIES=Object.keys(DATA);
const MAX_SLOTS=4;
let slots=[{ser:'Floor One S7',model:'S7 Station Auto'},{ser:'Floor One S9',model:'S9 Artist Steam Pro'}];

function getModelData(ser,model){return DATA[ser]&&DATA[ser].models[model]?DATA[ser].models[model]:null;}

function buildSlotHTML(i){
  const s=slots[i];
  const serOpts=SERIES.map(sr=>`<option value="${sr}"${sr===s.ser?'selected':''}>${sr}</option>`).join('');
  const models=DATA[s.ser]?Object.keys(DATA[s.ser].models):[];
  const modOpts='<option value="">— select model —</option>'+models.map(m=>`<option value="${m}"${m===s.model?'selected':''}>${m}</option>`).join('');
  const canRemove=slots.length>1;
  return`<div class="slot" id="slot${i}">
    <div class="slot-label"><span>${BADGE_LABELS[i]}</span>${canRemove?`<button onclick="removeSlot(${i})" title="Remove">✕</button>`:''}</div>
    <select onchange="updateSlotSer(${i},this.value)">${serOpts}</select>
    <select onchange="updateSlotModel(${i},this.value)">${modOpts}</select>
  </div>`;
}

function renderSlots(){
  const wrap=document.getElementById('slotsWrap');
  let html=slots.map((_,i)=>buildSlotHTML(i)).join('');
  if(slots.length<MAX_SLOTS) html+=`<button class="add-btn" onclick="addSlot()">＋ Add model</button>`;
  wrap.innerHTML=html;
}

function addSlot(){
  if(slots.length>=MAX_SLOTS)return;
  slots.push({ser:'Dreame',model:'H16 Pro Steam'});
  renderSlots();render();
}

function removeSlot(i){
  if(slots.length<=1)return;
  slots.splice(i,1);
  renderSlots();render();
}

function updateSlotSer(i,ser){
  slots[i].ser=ser;
  const models=DATA[ser]?Object.keys(DATA[ser].models):[];
  slots[i].model=models[0]||'';
  renderSlots();render();
}

function updateSlotModel(i,model){
  slots[i].model=model;
  render();
}

function val(v){
  if(v==='✅')return'<span class="val-yes">✓</span>';
  if(v==='❌')return'<span class="val-no">✗</span>';
  if(!v||v==='—')return'<span style="color:#bbb;font-size:12px">—</span>';
  return'<span class="val-text">'+v+'</span>';
}

function numOf(s){
  if(!s||s==='—'||s==='❌'||s==='✅')return null;
  if(s.includes('/')||s.includes('('))return null;
  const m=s.match(/(\d+(\.\d+)?)/);return m?parseFloat(m[1]):null;
}

function hlClass(vals,idx,hi){
  const nums=vals.map(v=>numOf(v));
  const valid=nums.filter(n=>n!==null);
  if(valid.length<2)return'';
  const best=hi?Math.max(...valid):Math.min(...valid);
  return nums[idx]===best&&valid.filter(n=>n===best).length<valid.length?'hl':'';
}

function modesCell(d){
  if(!d||!d.modes||!d.modes.length)return'<span style="color:#bbb;font-size:12px">—</span>';
  return'<div class="modes-cell">'+d.modes.map(m=>'<span class="mode-tag">'+m+'</span>').join('')+'</div>';
}

function sec(label,cols){
  return`<tr class="section-row"><th class="col-feature">${label}</th>${cols.map(()=>'<td></td>').join('')}</tr>`;
}

function row(label,dArr,key,hi=true){
  const vals=dArr.map(d=>d?d[key]||'—':'—');
  const cells=vals.map((v,i)=>`<td class="col-model ${hlClass(vals,i,hi)}">${dArr[i]?val(v):'<span style="color:#bbb">—</span>'}</td>`).join('');
  return`<tr><th class="col-feature">${label}</th>${cells}</tr>`;
}

function brow(label,dArr,key){
  const cells=dArr.map(d=>`<td class="col-model">${d?val(d[key]||'—'):'—'}</td>`).join('');
  return`<tr><th class="col-feature">${label}</th>${cells}</tr>`;
}

function modesRow(dArr){
  const cells=dArr.map(d=>`<td class="col-model">${modesCell(d)}</td>`).join('');
  return`<tr><th class="col-feature">Cleaning modes</th>${cells}</tr>`;
}

function render(){
  const out=document.getElementById('output');
  const active=slots.map(s=>({ser:s.ser,model:s.model,data:getModelData(s.ser,s.model)}));
  const hasAny=active.some(a=>a.model&&a.data);
  if(!hasAny){out.innerHTML='<div class="empty-state">Select at least one model to compare</div>';return;}

  const dArr=active.map(a=>a.data);
  const n=active.length;

  // Headers
  const headCells=active.map((a,i)=>{
    if(!a.model||!a.data)return`<th class="col-model"><span style="color:#bbb;font-size:13px">—</span></th>`;
    const brand=DATA[a.ser]?DATA[a.ser].brand:'';
    return`<th class="col-model brand-${brand.toLowerCase()}">
      <div class="badge badge-${i}">${BADGE_LABELS[i]}</div>
      <div class="model-head">${brand?brand+' ':''} ${a.model}</div>
      <div class="brand-head">${a.ser}</div>
    </th>`;
  }).join('');

  const cols=active.map(()=>null);

  // Determine which sections to show
  const isTinecoFloor=s=>["Floor One S6","Floor One S7","Floor One S9","iFloor i Series","Y Series"].includes(s);
  const isDreame=s=>s==="Dreame";
  const isRoborock=s=>s==="Roborock";
  const showFloor=active.some(a=>isTinecoFloor(a.ser)||isDreame(a.ser)||isRoborock(a.ser));
  const hasTanks=dArr.some(d=>d&&d.clean_tank&&d.clean_tank!=='—');

  let body=sec("Performance",cols)+row("Suction power",dArr,"suction",true)+modesRow(dArr)+row("Runtime (mins)",dArr,"runtime",true);

  if(showFloor){
    body+=sec("Steam",cols)+brow("Steam cleaning",dArr,"steam");
    body+=sec("Cleaning features",cols)+brow("Lay-flat design",dArr,"lay_flat")+brow("Electrolyzed water",dArr,"electrolyzed")+brow("Edge cleaning",dArr,"edge")+brow("Anti-tangle",dArr,"antitangle")+brow("ReverseScrub technology",dArr,"reverse_scrub");
    body+=sec("Self-cleaning",cols)+brow("Self-clean system",dArr,"self_clean")+brow("SilentDry mode",dArr,"silentdry");
    body+=sec("Maneuverability",cols)+brow("Swivel / propulsion",dArr,"self_prop");
    if(hasTanks) body+=sec("Water tanks",cols)+row("Clean water tank",dArr,"clean_tank",true)+row("Dirty water tank",dArr,"dirty_tank",true);
  }

  // Extras — union of all keys across all models
  const allExtraKeys=[...new Set(dArr.flatMap(d=>d?Object.keys(d.extras||{}):[])) ];
  if(allExtraKeys.length){
    body+=sec("Additional features",cols);
    allExtraKeys.forEach(k=>{
      const cells=dArr.map(d=>`<td class="col-model">${val(d?.extras?.[k]||'❌')}</td>`).join('');
      body+=`<tr><th class="col-feature">${k}</th>${cells}</tr>`;
    });
  }

  // Warranty row — Tineco models show 2-Year Local, competitors show —
  const warrantyCells=active.map(a=>{
    const isTineco=DATA[a.ser]&&DATA[a.ser].brand==='Tineco';
    return`<td class="col-model">${isTineco&&a.data?'<span class="val-text">2-Year Local</span>':'<span style="color:#bbb;font-size:12px">—</span>'}</td>`;
  }).join('');
  body+=`<tr><th class="col-feature warranty-th">Warranty</th>${warrantyCells}</tr>`;

  // Column widths: feature col fixed, model cols equal
  const colW=`<col style="width:140px">` + active.map(()=>`<col style="min-width:150px">`).join('');

  out.innerHTML=`<div class="compare-wrap"><table class="compare-table"><colgroup>${colW}</colgroup><thead><tr class="head-row"><th class="col-feature"></th>${headCells}</tr></thead><tbody>${body}</tbody></table></div>`;
}

renderSlots();
render();
</script>
</body>
</html>
